[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fewshot-model-embedding"
version = "0.1.0"
description = "Auditable few-response model embeddings for unseen LLM benchmark prediction"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
  "torch>=2.2",
  "matplotlib>=3.7,<4",
  "requests>=2.31,<3",
  "psutil>=5.9,<8",
  "threadpoolctl>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

